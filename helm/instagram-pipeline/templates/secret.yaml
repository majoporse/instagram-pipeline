apiVersion: v1
kind: Secret
metadata:
  name: {{ include "instagram-pipeline.secretName" . }}
  labels:
    {{- include "instagram-pipeline.labels" . | nindent 4 }}
type: Opaque
stringData:
  OPENAI_API_KEY: {{ .Values.secrets.openaiApiKey | quote }}
  INSTAGRAM_ACCESS_TOKEN: {{ .Values.secrets.instagramAccessToken | quote }}
  S3_ACCESS_KEY: {{ .Values.secrets.s3AccessKey | quote }}
  S3_SECRET_KEY: {{ .Values.secrets.s3SecretKey | quote }}
  AUTH_PASSWORD: {{ .Values.secrets.authPassword | quote }}
  AUTH_SECRET_KEY: {{ .Values.secrets.authSecretKey | quote }}
