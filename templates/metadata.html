<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      width: 1080px;
      height: 1080px;
      font-family: "Georgia", serif;
      background:
        radial-gradient(circle at 20% 10%, rgba(255,255,255,0.12), transparent 55%),
        linear-gradient(135deg, #0f172a 0%, #1e293b 55%, #0d0f1a 100%);
      color: #e2e8f0;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .card {
      width: 920px;
      padding: 72px 64px;
      border: 1px solid rgba(148, 163, 184, 0.35);
      border-radius: 24px;
      background: rgba(15, 23, 42, 0.55);
      backdrop-filter: blur(8px);
      box-shadow: 0 30px 60px rgba(0, 0, 0, 0.55);
      text-align: center;
    }

    .kicker {
      font-family: "Avenir Next", "Helvetica Neue", sans-serif;
      letter-spacing: 0.42em;
      text-transform: uppercase;
      font-size: 22px;
      color: #38bdf8;
      margin-bottom: 28px;
    }

    h1 {
      font-size: 64px;
      line-height: 1.08;
      font-weight: 400;
      letter-spacing: -0.01em;
      color: #f8fafc;
      margin-bottom: 20px;
    }

    .rule { width: 96px; height: 3px; background: #38bdf8; margin: 32px auto; border-radius: 2px; }

    .meta {
      font-family: "Avenir Next", "Helvetica Neue", sans-serif;
      font-size: 26px;
      color: #94a3b8;
      display: flex;
      justify-content: center;
      gap: 40px;
      flex-wrap: wrap;
    }

    .meta span b { color: #e2e8f0; font-weight: 600; }

    .body {
      font-size: 30px;
      line-height: 1.55;
      color: #cbd5e1;
      max-width: 720px;
      margin: 44px auto 0;
      font-style: italic;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="kicker">Project Kicks</div>
    <h1>{{ title }}</h1>
    <div class="rule"></div>
    <div class="meta">
      <span>{{ location }}</span>
      <span>{{ date }}</span>
    </div>
    <p class="body">{{ body }}</p>
  </div>
</body>
</html>
